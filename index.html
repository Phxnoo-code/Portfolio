<body style="background-color: #030303;" class="bg-background text-text-primary antialiased selection:bg-primary/30 selection:text-primary">
  <div id="root">
    <div style="
      position: fixed;
      inset: 0;
      z-index: 9999;
      background-color: #030303;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: 'Manrope', 'Inter', system-ui, -apple-system, sans-serif;
      user-select: none;
      overflow: hidden;
    ">
      <!-- Background Soft Ambient Light Spot -->
      <div style="
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 350px;
        height: 350px;
        background-color: rgba(124, 92, 255, 0.04);
        border-radius: 50%;
        filter: blur(120px);
        pointer-events: none;
      "></div>

      <!-- Centered Loading Block -->
      <div style="
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        max-width: 340px;
        z-index: 10;
        animation: htmlFadeIn 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      ">
        <!-- Brand Signature -->
        <span style="
          font-size: 16px;
          letter-spacing: 0.3em;
          color: rgba(255, 255, 255, 0.9);
          font-weight: 300;
          text-transform: uppercase;
          display: block;
          line-height: 1;
        ">PHANOO</span>

        <!-- Tagline -->
        <span style="
          font-size: 9px;
          letter-spacing: 0.25em;
          color: rgba(255, 255, 255, 0.3);
          text-transform: uppercase;
          display: block;
          line-height: 1;
          margin-top: 6px;
        ">DESIGN  •  CODE  •  AUTOMATION</span>

        <!-- Progress Bar (Indeterminate track and shim) -->
        <div style="
          width: 100%;
          height: 1px;
          background-color: rgba(255, 255, 255, 0.08);
          position: relative;
          overflow: hidden;
          border-radius: 9999px;
          margin-top: 32px;
        ">
          <div style="
            position: absolute;
            top: 0;
            left: 0;
            width: 33.3%;
            height: 100%;
            background-color: #7C5CFF;
            box-shadow: 0 0 6px rgba(124, 92, 255, 0.4);
            border-radius: 9999px;
            animation: htmlShimmer 2.8s ease-in-out infinite;
          "></div>
        </div>

        <!-- Status Text -->
        <span style="
          font-size: 9px;
          letter-spacing: 0.22em;
          color: rgba(255, 255, 255, 0.3);
          text-transform: uppercase;
          display: block;
          line-height: 1;
          margin-top: 26px;
        ">PREPARING DIGITAL EXPERIENCE</span>
      </div>
    </div>

    <style>
      @keyframes htmlFadeIn {
        from {
          opacity: 0;
          transform: translateY(12px);
          filter: blur(5px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
          filter: blur(0px);
        }
      }
      @keyframes htmlShimmer {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(300%);
        }
      }
    </style>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
